services:
  bridge:
    build: .
    container_name: archipelago-discord-bridge
    env_file: .env
    ports:
      # Bridge HTTP port: /health only. Interactions arrive over the Discord
      # gateway (discord.js), so this port does not need to be public.
      - "${PORT:-3000}:${PORT:-3000}"
      # Archipelago game servers: the bridge spawns one server per running game
      # on BASE_PORT (default 38281) and up. Players connect to these ports, so
      # they must be published. Keep the range in sync with BASE_PORT.
      - "${BASE_PORT:-38281}-${AP_PORT_RANGE_END:-38290}:${BASE_PORT:-38281}-${AP_PORT_RANGE_END:-38290}"
    volumes:
      - ./data:/data
    restart: unless-stopped
