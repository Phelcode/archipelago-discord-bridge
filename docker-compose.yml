services:
  bridge:
    build: .
    container_name: ap-manager
    env_file: .env
    ports:
      # Bridge HTTP port: /health only. Interactions arrive over the Discord
      # gateway (discord.js), so this port does not need to be public.
      - "${PORT:-3000}:${PORT:-3000}"
      # Archipelago game servers: the bridge spawns one server per running game
      # on BASE_PORT (default 38281) and up. Players connect to these ports.
      # The servers bind 0.0.0.0 inside the container: docker-proxy forwards
      # published ports to the container's IPv4 address, so an IPv6-only (::)
      # bind would be unreachable from outside. Publishing the range on both
      # 0.0.0.0 and [::] lets players connect via either address family of the
      # host. Keep the range in sync with BASE_PORT. On a host without IPv6,
      # remove the [::] line.
      - "${BASE_PORT:-38281}-${AP_PORT_RANGE_END:-38290}:${BASE_PORT:-38281}-${AP_PORT_RANGE_END:-38290}"
      - "[::]:${BASE_PORT:-38281}-${AP_PORT_RANGE_END:-38290}:${BASE_PORT:-38281}-${AP_PORT_RANGE_END:-38290}"
    volumes:
      - ./data:/data
    restart: unless-stopped
